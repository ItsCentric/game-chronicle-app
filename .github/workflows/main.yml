name: 'generate bundles'

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      
      - name: setup bun
        uses: oven-sh/setup-bun@v1

      - name: install frontend dependencies
        run: bun install

      - name: Install cargo tauri cli
        run: cargo install tauri-cli@^2.0.0

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATE_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATE_SIGNING_PASSWORD }}
        with:
          publish: false
          #tagName: v__VERSION__
          #releaseName: 'v__VERSION__'
          releaseName: 'test'
          releaseDraft: true
          #prerelease: ${{ contains(github.ref_name, '-') }}
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          
      - name: Rename Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd src-tauri/target/*/release/bundle/deb
          for f in *.deb; do
            mv "$f" "${f%.deb}_linux.deb"
          done
          
      - name: Rename macOS artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/*/release/bundle/deb || exit 0
          for f in *.deb; do
            mv "$f" "${f%.deb}_macos.deb"
          done
